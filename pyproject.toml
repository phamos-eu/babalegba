[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "babalegba"
version = "0.0.1"
description = "Collective knowledge base for Frappe and ERPNext development"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0"}
authors = [
    {name = "Phamos GmbH", email = "support@phamos.eu"}
]
dependencies = [
    "frappe>=16.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8"
]

[tool.setuptools]
packages = ["babalegba"]
include-package-data = true

# Frappe Cloud compatibility: Define Frappe version dependency
[tool.bench.frappe-dependencies]
frappe = ">=16.0.0"
